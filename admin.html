<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Редактор сайта · Космос</title><link rel="stylesheet" href="https://unpkg.com/grapesjs@0.22.8/dist/css/grapes.min.css"><style>*{box-sizing:border-box}body{margin:0;background:#04030a;color:#f4f1fb;font:15px system-ui}header{height:auto;min-height:64px;padding:12px 18px;background:#0b0816;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #8a4dff}header strong{margin-right:auto}input,button{padding:10px 12px;border-radius:8px;border:1px solid #8a4dff;background:#171126;color:#fff}button{cursor:pointer;background:#ffc629;color:#181126;font-weight:700}#status{color:#c3a8ff}#gjs{height:calc(100dvh - 108px)!important;min-height:360px}@media(max-width:700px){#gjs{height:calc(100dvh - 154px)!important;min-height:320px}}#login{position:fixed;z-index:5;inset:68px 0 0;background:#04030a;display:grid;place-content:center;gap:12px}#login[hidden]{display:none}</style></head><body><header><strong>Космос · визуальный редактор</strong><input id="pw" type="password" autocomplete="current-password" placeholder="Пароль администратора"><button id="loginBtn">Войти</button><button id="photos" disabled>Фото</button><button id="publish" disabled>Опубликовать</button><span id="status">Войдите для редактирования</span></header><div id="login"><input id="workerUrl" type="url" placeholder="URL Worker, например https://cosmos-visual-cms.…workers.dev"><button id="start">Подключиться</button><small>Worker URL сохранится только в этой вкладке.</small></div><div id="gjs"></div><script src="https://unpkg.com/grapesjs@0.22.8"></script><script>
(()=>{let editor,token='',worker='',bodyScripts=[],sourceHtml='';const $=id=>document.getElementById(id),say=t=> $('status').textContent=t;
$('start').onclick=()=>{worker=$('workerUrl').value.trim().replace(/\/$/,'');if(!/^https:\/\/[a-z0-9.-]+\.workers\.dev$/i.test(worker)){say('Укажите HTTPS URL Cloudflare Worker');return}$('login').hidden=true;$('pw').focus();say('Введите пароль и нажмите «Войти»')};
$('loginBtn').onclick=async()=>{try{if(!worker)throw Error('Сначала укажите URL Worker');const r=await fetch(worker+'/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('pw').value})});const d=await r.json();if(!r.ok)throw Error(d.error||'Вход не выполнен');token=d.token;$('pw').value='';say('Загружаю сайт…');const page=await fetch('./index.html',{cache:'no-store'});if(!page.ok)throw Error('Не удалось открыть index.html');const src=await page.text(),doc=new DOMParser().parseFromString(src,'text/html');sourceHtml=src;bodyScripts=[...doc.body.querySelectorAll('script')].map(x=>x.outerHTML);doc.body.querySelectorAll('script').forEach(x=>x.remove());const css=[...doc.querySelectorAll('style')].map(x=>x.textContent).join('\n');editor=grapesjs.init({container:'#gjs',height:'100%',fromElement:false,storageManager:false,components:doc.body.innerHTML,style:css,canvas:{styles:[...doc.querySelectorAll('link[rel=stylesheet]')].map(x=>x.href)}});$('publish').disabled=false;$('photos').disabled=false;say('Готово. Нажмите на текст или блок, чтобы изменить.')}catch(e){say(e.message)}};
$('photos').onclick=()=>photoPanel(sourceHtml,async html=>{const r=await fetch(worker+'/publish',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({html})});const j=await r.json();if(!r.ok)throw Error(j.error||'Ошибка сохранения');sourceHtml=html;say('Фото сохранены')});
$('publish').onclick=async()=>{if(!editor||!token)return;try{$('publish').disabled=true;say('Публикую…');const parsed=new DOMParser().parseFromString(await (await fetch('./index.html',{cache:'no-store'})).text(),'text/html');parsed.body.innerHTML=editor.getHtml()+bodyScripts.join('\n');const css=editor.getCss();if(css){const st=parsed.createElement('style');st.textContent=css;parsed.head.append(st)}const html='<!doctype html>\n'+parsed.documentElement.outerHTML;const r=await fetch(worker+'/publish',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({html})});const d=await r.json();if(!r.ok)throw Error(d.error||'Публикация не прошла');say('Опубликовано. GitHub Pages обновит сайт после сборки.')}catch(e){say(e.message)}finally{$('publish').disabled=false}};
function photoPanel(source,publish){const d=document.createElement('dialog');d.style='position:fixed;inset:4vh 3vw;width:94vw;height:92vh;max-width:none;background:#0b0816;color:white;border:1px solid #8a4dff;border-radius:16px;padding:16px;overflow:auto';d.innerHTML='<button data-x>Закрыть</button><h2>Фото сайта</h2><p>Выбери фото сайта для замены. Новый файл можно добавить в фотоальбом «Земля».</p><select data-key></select><input data-file type="file" accept="image/jpeg,image/png,image/webp"><input data-name placeholder="Имя нового фото (латиницей)"><button data-add>Добавить фото в «Землю»</button><button data-save>Сохранить</button><div data-grid style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;max-height:55vh;overflow:auto"></div>';document.body.append(d);let html=source,selected='',data='';const sel=d.querySelector('[data-key]'),grid=d.querySelector('[data-grid]'),all=[];for(const m of html.matchAll(/(?:IM\.)?([\w]+):?="(data:image\/(?:jpeg|png|webp);base64,[^"]+)"/g)){if(/^(sun|moon|earth|reception|pilates|spine|shower|wc|wcs|lk)/.test(m[1])&&!all.some(x=>x[0]===m[1]))all.push([m[1],m[2]])}for(const [k,v] of all){sel.add(new Option(k,k));const c=document.createElement('button');c.type='button';c.style='background:#171126;color:white;padding:5px';const im=document.createElement('img');im.src=v;im.alt=k;im.style='width:100%;height:90px;object-fit:cover';c.append(im,document.createTextNode(k));c.onclick=()=>{selected=k;sel.value=k;grid.querySelectorAll('button').forEach(x=>x.style.outline='');c.style.outline='3px solid #ffc629'};grid.append(c)}d.querySelector('[data-file]').onchange=e=>{const f=e.target.files[0];if(!f)return;if(!/^image\/(jpeg|png|webp)$/.test(f.type)||f.size>2000000){alert('JPG, PNG или WebP до 2 МБ');return}const r=new FileReader();r.onload=()=>data=r.result;r.readAsDataURL(f)};d.querySelector('[data-add]').onclick=()=>{const name=d.querySelector('[data-name]').value.trim();if(!data||!/^[_a-zA-Z][_a-zA-Z0-9]*$/.test(name))return alert('Выбери фото и задай имя латиницей');if(all.some(x=>x[0]===name))return alert('Это имя уже занято');html=html.replace('var IM={','var IM={'+name+':"'+data+'",');const album=/earth:\{[^}]*keys:\[([^\]]*)/.exec(html);if(!album)return alert('Не найдена папка Земля');html=html.replace(album[0],album[0]+' ,"'+name+'"');sel.add(new Option(name,name));selected=name;data='';alert('Фото добавлено в альбом Земля. Нажми «Сохранить».')};d.querySelector('[data-save]').onclick=async()=>{try{if(data&&selected){const re=new RegExp('(IM\\.'+selected+'=")(data:image\\/(?:jpeg|png|webp);base64,[^"]+)(")');if(!re.test(html))throw Error('Фото не найдено в коде');html=html.replace(re,'$1'+data+'$3')}if(html.length>18*1024*1024)throw Error('Фото слишком большое. Выбери файл до 2 МБ.');await publish(html);d.remove()}catch(e){alert(e.message)}};d.querySelector('[data-x]').onclick=()=>d.remove();d.showModal()}})();</script></body></html>
