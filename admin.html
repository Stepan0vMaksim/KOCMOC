<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Редактор сайта · Космос</title><link rel="stylesheet" href="https://unpkg.com/grapesjs@0.22.8/dist/css/grapes.min.css"><style>*{box-sizing:border-box}body{margin:0;background:#04030a;color:#f4f1fb;font:15px system-ui}header{height:auto;min-height:64px;padding:12px 18px;background:#0b0816;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #8a4dff}header strong{margin-right:auto}input,button{padding:10px 12px;border-radius:8px;border:1px solid #8a4dff;background:#171126;color:#fff}button{cursor:pointer;background:#ffc629;color:#181126;font-weight:700}#status{color:#c3a8ff}#gjs{height:calc(100dvh - 108px)!important;min-height:360px}@media(max-width:700px){#gjs{height:calc(100dvh - 154px)!important;min-height:320px}}#login{position:fixed;z-index:5;inset:68px 0 0;background:#04030a;display:grid;place-content:center;gap:12px}#login[hidden]{display:none}</style></head><body><header><strong>Космос · визуальный редактор</strong><input id="pw" type="password" autocomplete="current-password" placeholder="Пароль администратора"><button id="loginBtn">Войти</button><button id="photos" disabled>Фото</button><button id="links" disabled>Ссылки</button><button id="docs" disabled>Документы</button><button id="publish" disabled>Опубликовать</button><span id="status">Войдите для редактирования</span></header><div id="login"><input id="workerUrl" type="url" placeholder="URL Worker, например https://cosmos-visual-cms.…workers.dev"><button id="start">Подключиться</button><small>Worker URL сохранится только в этой вкладке.</small></div><div id="gjs"></div><script src="https://unpkg.com/grapesjs@0.22.8"></script><script>
(()=>{let editor,token='',worker='',bodyScripts=[],sourceHtml='',baseHtml='';const $=id=>document.getElementById(id),say=t=> $('status').textContent=t;
$('start').onclick=()=>{worker=$('workerUrl').value.trim().replace(/\/$/,'');if(!/^https:\/\/[a-z0-9.-]+\.workers\.dev$/i.test(worker)){say('Укажите HTTPS URL Cloudflare Worker');return}$('login').hidden=true;$('pw').focus();say('Введите пароль и нажмите «Войти»')};
$('loginBtn').onclick=async()=>{try{if(!worker)throw Error('Сначала укажите URL Worker');const r=await fetch(worker+'/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('pw').value})});const d=await r.json();if(!r.ok)throw Error(d.error||'Вход не выполнен');token=d.token;$('pw').value='';say('Загружаю сайт…');const page=await fetch('./index.html',{cache:'no-store'});if(!page.ok)throw Error('Не удалось открыть index.html');const src=await page.text(),doc=new DOMParser().parseFromString(src,'text/html');sourceHtml=src;baseHtml=src;bodyScripts=[...doc.body.querySelectorAll('script')].map(x=>x.outerHTML);doc.body.querySelectorAll('script').forEach(x=>x.remove());const css=[...doc.querySelectorAll('style')].map(x=>x.textContent).join('\n');editor=grapesjs.init({container:'#gjs',height:'100%',fromElement:false,storageManager:false,components:doc.body.innerHTML,style:css,canvas:{styles:[...doc.querySelectorAll('link[rel=stylesheet]')].map(x=>x.href)}});$('publish').disabled=false;$('photos').disabled=false;$('links').disabled=false;$('docs').disabled=false;say('Готово. Нажмите на текст или блок, чтобы изменить.')}catch(e){say(e.message)}};
const capture=()=>{if(!editor)return sourceHtml;const p=new DOMParser().parseFromString(sourceHtml,'text/html');p.body.innerHTML=editor.getHtml()+bodyScripts.join('\n');p.head.querySelector('[data-cms-style]')?.remove();const st=p.createElement('style');st.dataset.cmsStyle='1';st.textContent=editor.getCss();p.head.append(st);return '<!doctype html>\n'+p.documentElement.outerHTML};
const send=async html=>{const r=await fetch(worker+'/publish',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({html})}),j=await r.json();if(!r.ok)throw Error(j.error||'Ошибка сохранения');sourceHtml=html;baseHtml=(await fetch('./index.html',{cache:'no-store'}).then(r=>r.text()));const fresh=new DOMParser().parseFromString(html,'text/html');bodyScripts=[...fresh.body.querySelectorAll('script')].map(x=>x.outerHTML);fresh.body.querySelectorAll('script').forEach(x=>x.remove());editor.setComponents(fresh.body.innerHTML);editor.setStyle([...fresh.querySelectorAll('style')].map(x=>x.textContent).join('\n'));say('Изменения сохранены в GitHub')};
$('photos').onclick=()=>{sourceHtml=capture();photoPanel(sourceHtml,send)};$('links').onclick=()=>{sourceHtml=capture();linkPanel(sourceHtml,send)};$('docs').onclick=()=>{sourceHtml=capture();docPanel(sourceHtml,send)};
$('publish').onclick=async()=>{if(!editor||!token)return;try{$('publish').disabled=true;say('Публикую…');const parsed=new DOMParser().parseFromString(await (await fetch('./index.html',{cache:'no-store'})).text(),'text/html');parsed.body.innerHTML=editor.getHtml()+bodyScripts.join('\n');const css=editor.getCss();if(css){const st=parsed.createElement('style');st.textContent=css;parsed.head.append(st)}const html='<!doctype html>\n'+parsed.documentElement.outerHTML;const r=await fetch(worker+'/publish',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({html})});const d=await r.json();if(!r.ok)throw Error(d.error||'Публикация не прошла');say('Опубликовано. GitHub Pages обновит сайт после сборки.')}catch(e){say(e.message)}finally{$('publish').disabled=false}};
function panel(title,body){const d=document.createElement('dialog');d.style='position:fixed;inset:4vh 3vw;width:94vw;height:92vh;max-width:none;background:#0b0816;color:white;border:1px solid #8a4dff;border-radius:16px;padding:16px;overflow:auto';d.innerHTML='<button data-x>Закрыть</button><h2>'+title+'</h2>'+body;document.body.append(d);d.querySelector('[data-x]').onclick=()=>d.remove();d.showModal();return d}
function photoPanel(source,save){function editAlbum(text,album,key,add){const re=new RegExp('('+album+':\\{[^}]*?keys:\\[)([^\\]]*)(\\])'),m=text.match(re);if(!m)throw Error('Альбом не найден');let keys=m[2].split(',').map(x=>x.trim().replace(/^['\"]|['\"]$/g,'')).filter(Boolean);keys=add?[...new Set([...keys,key])]:keys.filter(x=>x!==key);return text.replace(re,m[1]+keys.map(x=>'\"'+x+'\"').join(',')+m[3])};const d=panel('Фото сайта','<p>Выбери фото и замени его файлом. Новое фото добавится в альбом «Земля».</p><select data-key></select><input data-file type=file accept="image/jpeg,image/png,image/webp"><input data-name placeholder="Имя нового фото латиницей"><select data-album><option value="earth">Зал Земля</option><option value="other">Ресепшен и прочее</option><option value="sun">Зал Солнце</option><option value="moon">Зал Луна</option></select><button data-add>Добавить в альбом</button><button data-remove>Убрать из альбома</button><button data-save>Сохранить замену</button><div data-grid style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;max-height:55vh;overflow:auto"></div>');let html=source,selected='',data='',changed=false;const sel=d.querySelector('[data-key]'),grid=d.querySelector('[data-grid]'),items=new Map();for(const m of html.matchAll(/(?:IM\.)?([\w]+):?="(data:image\/(?:jpeg|png|webp);base64,[^"]+)"/g))if(/^(sun|moon|earth|reception|pilates|spine|shower|wc|wcs|lk)/.test(m[1]))items.set(m[1],m[2]);for(const [k,v] of items){sel.add(new Option(k,k));const b=document.createElement('button');b.type='button';b.style='color:white;background:#171126';const i=document.createElement('img');i.src=v;i.alt=k;i.style='width:100%;height:90px;object-fit:cover';b.append(i,document.createTextNode(k));b.onclick=()=>{selected=k;sel.value=k};grid.append(b)}d.querySelector('[data-file]').onchange=e=>{const f=e.target.files[0];if(!f)return;if(!/^image\/(jpeg|png|webp)$/.test(f.type)||f.size>2000000)return alert('JPG, PNG или WebP до 2 МБ');const r=new FileReader();r.onload=()=>data=r.result;r.readAsDataURL(f)};d.querySelector('[data-add]').onclick=()=>{const name=d.querySelector('[data-name]').value.trim();if(!data||!/^[_a-zA-Z][_a-zA-Z0-9]*$/.test(name)||items.has(name))return alert('Выбери фото и новое имя латиницей');html=html.replace('var IM={','var IM={'+name+':"'+data+'",');const album=d.querySelector('[data-album]').value;html=html.replace(new RegExp('('+album+':\\{[^}]*keys:\\[[^\]]*)'),m=>m+',"'+name+'"');sel.add(new Option(name,name));selected=name;data='';changed=true;alert('Добавлено. Нажми «Сохранить замену».')};d.querySelector('[data-remove]').onclick=()=>{if(!selected)return alert('Выбери фото');const album=d.querySelector('[data-album]').value;html=html.replace(new RegExp('(\\b'+album+':\\{[^}]*keys:\\[[^\]]*)\"'+selected+'\",?'),m=>m.replace('\"'+selected+'\",?',''));alert('Фото удалено из альбома. Нажми «Сохранить замену».')};d.querySelector('[data-save]').onclick=async()=>{if(!selected||(!data&&!changed))return alert('Выбери фото и действие');if(data){const re=new RegExp('((?:IM\\.)?'+selected+'(?:=|:)")(data:image\\/(?:jpeg|png|webp);base64,[^"]+)(")');if(!re.test(html))return alert('Фото не найдено в данных');html=html.replace(re,'$1'+data+'$3')}try{await save(html);d.remove()}catch(e){alert(e.message)}}}
function linkPanel(source,save){const p=new DOMParser().parseFromString(source,'text/html'),as=[...p.querySelectorAll('a[href]')],d=panel('Ссылки сайта','<p>Поменяй подпись и адрес кнопки или ссылки. Список включает все ссылки страницы.</p><select data-link></select><label>Текст<br><input data-text style="width:100%"></label><label>Адрес<br><input data-href style="width:100%"></label><button data-save>Сохранить ссылку</button>');const s=d.querySelector('[data-link]');as.forEach((a,i)=>s.add(new Option((a.textContent.trim()||'ссылка').slice(0,55)+' → '+a.getAttribute('href'),i)));function load(){const a=as[+s.value];if(a){d.querySelector('[data-text]').value=a.textContent;d.querySelector('[data-href]').value=a.getAttribute('href')}}s.onchange=load;load();d.querySelector('[data-save]').onclick=async()=>{const a=as[+s.value],href=d.querySelector('[data-href]').value.trim();if(!a||!href||/^(javascript|data|vbscript):/i.test(href))return alert('Укажи безопасный адрес ссылки');a.textContent=d.querySelector('[data-text]').value;a.setAttribute('href',href);try{await save('<!doctype html>\n'+p.documentElement.outerHTML);d.remove()}catch(e){alert(e.message)}}}
function docPanel(source,save){const d=panel('Документы','<p>Загрузи новую версию PDF или DOCX для выбранного пункта.</p><select data-doc><option value="of">Публичная оферта</option><option value="a1">Приложение №1 · Правила</option><option value="a2">Приложение №2 · Техника безопасности</option><option value="a3">Приложение №3 · Прайс</option></select><input data-file type=file accept="application/pdf,.docx"><button data-save>Заменить документ</button>');let data='';d.querySelector('[data-file]').onchange=e=>{const f=e.target.files[0];if(!f)return;if(f.size>4000000||(!f.name.toLowerCase().endsWith('.docx')&&f.type!=='application/pdf'))return alert('PDF или DOCX до 4 МБ');const r=new FileReader();r.onload=()=>data=r.result;r.readAsDataURL(f)};d.querySelector('[data-save]').onclick=async()=>{if(!data)return alert('Выбери файл');const k=d.querySelector('[data-doc]').value,re=new RegExp('("'+k+'":")(?:data:application\\/(?:pdf|vnd\\.openxmlformats-officedocument\\.wordprocessingml\\.document);base64,[^"]+)(")');if(!re.test(source))return alert('Не нашёл документ '+k);try{await save(source.replace(re,'$1'+data+'$2'));d.remove()}catch(e){alert(e.message)}}}
})();</script></body></html>
