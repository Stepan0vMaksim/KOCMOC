<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Редактор сайта · Космос</title><link rel="stylesheet" href="https://unpkg.com/grapesjs@0.22.8/dist/css/grapes.min.css"><style>*{box-sizing:border-box}body{margin:0;background:#04030a;color:#f4f1fb;font:15px system-ui}header{height:auto;min-height:64px;padding:12px 18px;background:#0b0816;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #8a4dff}header strong{margin-right:auto}input,button{padding:10px 12px;border-radius:8px;border:1px solid #8a4dff;background:#171126;color:#fff}button{cursor:pointer;background:#ffc629;color:#181126;font-weight:700}#status{color:#c3a8ff}#gjs{height:calc(100dvh - 108px)!important;min-height:360px}@media(max-width:700px){#gjs{height:calc(100dvh - 154px)!important;min-height:320px}}#login{position:fixed;z-index:5;inset:68px 0 0;background:#04030a;display:grid;place-content:center;gap:12px}#login[hidden]{display:none}</style></head><body><header><strong>Космос · визуальный редактор</strong><input id="pw" type="password" autocomplete="current-password" placeholder="Пароль администратора"><button id="loginBtn">Войти</button><button id="publish" disabled>Опубликовать</button><span id="status">Войдите для редактирования</span></header><div id="login"><input id="workerUrl" type="url" placeholder="URL Worker, например https://cosmos-visual-cms.…workers.dev"><button id="start">Подключиться</button><small>Worker URL сохранится только в этой вкладке.</small></div><div id="gjs"></div><script src="https://unpkg.com/grapesjs@0.22.8"></script><script>
(()=>{let editor,token='',worker='',bodyScripts=[];const $=id=>document.getElementById(id),say=t=> $('status').textContent=t;
$('start').onclick=()=>{worker=$('workerUrl').value.trim().replace(/\/$/,'');if(!/^https:\/\/[a-z0-9.-]+\.workers\.dev$/i.test(worker)){say('Укажите HTTPS URL Cloudflare Worker');return}$('login').hidden=true;$('pw').focus();say('Введите пароль и нажмите «Войти»')};
$('loginBtn').onclick=async()=>{try{if(!worker)throw Error('Сначала укажите URL Worker');const r=await fetch(worker+'/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('pw').value})});const d=await r.json();if(!r.ok)throw Error(d.error||'Вход не выполнен');token=d.token;$('pw').value='';say('Загружаю сайт…');const page=await fetch('./index.html',{cache:'no-store'});if(!page.ok)throw Error('Не удалось открыть index.html');const src=await page.text(),doc=new DOMParser().parseFromString(src,'text/html');bodyScripts=[...doc.body.querySelectorAll('script')].map(x=>x.outerHTML);doc.body.querySelectorAll('script').forEach(x=>x.remove());const css=[...doc.querySelectorAll('style')].map(x=>x.textContent).join('\n');editor=grapesjs.init({container:'#gjs',height:'100%',fromElement:false,storageManager:false,components:doc.body.innerHTML,style:css,canvas:{styles:[...doc.querySelectorAll('link[rel=stylesheet]')].map(x=>x.href)}});$('publish').disabled=false;say('Готово. Нажмите на текст или блок, чтобы изменить.')}catch(e){say(e.message)}};
$('publish').onclick=async()=>{if(!editor||!token)return;try{$('publish').disabled=true;say('Публикую…');const parsed=new DOMParser().parseFromString(await (await fetch('./index.html',{cache:'no-store'})).text(),'text/html');parsed.body.innerHTML=editor.getHtml()+bodyScripts.join('\n');const css=editor.getCss();if(css){const st=parsed.createElement('style');st.textContent=css;parsed.head.append(st)}const html='<!doctype html>\n'+parsed.documentElement.outerHTML;const r=await fetch(worker+'/publish',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({html})});const d=await r.json();if(!r.ok)throw Error(d.error||'Публикация не прошла');say('Опубликовано. GitHub Pages обновит сайт после сборки.')}catch(e){say(e.message)}finally{$('publish').disabled=false}};
})();</script></body></html>
