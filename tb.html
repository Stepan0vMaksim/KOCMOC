:root{color-scheme:dark;--ink:#04030a;--card:#0b0816;--vio:#8a4dff;--vio2:#c3a8ff;--sun:#ffc629;--txt:#f4f1fb;--mut:#b2abc6;--edge:rgba(215,195,255,.55)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;color:var(--txt);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:radial-gradient(ellipse at 85% 2%,#271547 0,transparent 34%),radial-gradient(ellipse at 5% 78%,#160d2e 0,transparent 45%),var(--ink);min-height:100vh}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.28;background-image:radial-gradient(2px 2px at 9% 13%,white 55%,transparent 65%),radial-gradient(1px 1px at 44% 29%,white 55%,transparent 65%),radial-gradient(2px 2px at 81% 69%,white 55%,transparent 65%);background-size:390px 320px}
a{color:inherit}
.wrap{width:min(1120px,calc(100% - 32px));margin:auto;position:relative}
header{padding:24px 0 20px;border-bottom:1px solid rgba(195,168,255,.18)}
.brand{display:inline-flex;align-items:center;gap:12px;text-decoration:none;font:800 18px/1.1 "Supermolot","Arial Black",sans-serif;letter-spacing:.05em}
.planet{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--sun);color:#1b1200;box-shadow:0 0 25px rgba(255,198,41,.45)}
.headlink{float:right;text-decoration:none;padding:8px 14px;border:1px solid var(--edge);border-radius:999px;font-size:13px}
main{padding:42px 0 70px}
h1,h2,h3{font-family:"Supermolot","Arial Black",sans-serif;line-height:1.15}
h1{font-size:clamp(32px,6vw,58px);margin:0 0 12px;text-transform:uppercase;font-style:italic;text-shadow:0 0 25px rgba(138,77,255,.6)}
h2{font-size:25px;margin:0 0 20px}
h3{font-size:19px;margin:0 0 8px}
.accent{color:var(--sun)}
.lead{color:var(--mut);margin:0 0 28px;max-width:750px}
.glass{background:linear-gradient(145deg,rgba(44,28,76,.8),rgba(11,8,22,.97));border:1.5px solid var(--edge);border-radius:24px;box-shadow:0 0 26px rgba(138,77,255,.22)}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;padding:17px;margin:25px 0}
input,select{min-height:48px;border:1px solid var(--edge);border-radius:13px;background:#151023;color:var(--txt);padding:0 15px;font:inherit;outline:0}
input{flex:2 1 260px}select{flex:1 1 190px}
input:focus,select:focus{border-color:var(--sun);box-shadow:0 0 0 2px rgba(255,198,41,.15)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:23px}
.chip{border:1px solid var(--edge);border-radius:999px;background:#1b142c;color:var(--txt);padding:10px 16px;font:700 13px "Supermolot",sans-serif;cursor:pointer}
.chip[aria-pressed=true]{background:var(--sun);border-color:var(--sun);color:#1b1200}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}
.tile{display:flex;flex-direction:column;padding:21px;text-decoration:none;min-height:220px;transition:transform .2s,border-color .2s}
.tile:hover,.tile:focus-visible{transform:translateY(-4px);border-color:var(--sun)}
.tag{align-self:flex-start;display:inline-block;padding:4px 10px;border-radius:999px;background:var(--sun);color:#1b1200;font:700 11px "Supermolot",sans-serif;margin-bottom:18px}
.tile .hall{color:var(--mut);font-size:13px;margin-top:auto}
.tile .limit{color:var(--sun);font-weight:700;margin-top:10px;font-size:14px}
.detail{padding:clamp(20px,4vw,38px);max-width:900px}
.detail-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}
.detail h1{font-size:clamp(30px,5vw,48px);margin:10px 0 18px}
.weight{border:2px solid var(--sun);border-radius:18px;background:rgba(255,198,41,.1);padding:18px 22px;margin:22px 0;font:700 clamp(19px,3vw,26px)/1.35 "Supermolot",sans-serif;color:var(--sun)}
.label{display:block;color:var(--mut);font:600 12px system-ui,sans-serif;margin-bottom:7px;text-transform:uppercase;letter-spacing:.08em}
.section{border-top:1px solid rgba(215,195,255,.22);padding-top:20px;margin-top:22px}
.section p{margin:0}
ol,ul{padding-left:24px;margin:12px 0 0}li{margin:0 0 10px;padding-left:2px}
.notice{margin-top:22px;padding:15px 18px;border-radius:14px;background:rgba(138,77,255,.12);border:1px solid rgba(195,168,255,.35);color:var(--mut);font-size:14px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:10px 19px;border-radius:999px;border:1.5px solid var(--edge);background:#1c1530;text-decoration:none;font:700 14px "Supermolot",sans-serif;text-align:center}
.btn.primary{background:var(--sun);color:#1b1200;border-color:var(--sun)}
.empty{padding:26px;color:var(--mut)}
footer{border-top:1px solid rgba(195,168,255,.18);padding:22px 0 36px;color:var(--mut);font-size:13px}
@media(max-width:800px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:540px){main{padding-top:28px}.grid{grid-template-columns:1fr}.tile{min-height:0}.headlink{float:none;display:inline-block;margin-top:12px}.brand{display:flex}.toolbar{padding:12px}.detail-head{display:block}.actions .btn{flex:1 1 180px}}
</style>
</head>

<script type="application/json" id="equipment-data">[{"id":"shua-x9","file":"Беговая_дорожка_SHUA_X9","name":"Беговая дорожка SHUA X9 (SH-T860)","category":"Кардио","hall":"Солнце","limit":"До 180 кг — вес пользователя","muscles":"Ягодичные, квадрицепсы, задняя поверхность бедра, икроножные мышцы.","steps":["Проверьте полотно и крепления. Разомнитесь 5–10 минут, наденьте спортивную обувь.","Встаньте на боковые опоры и закрепите страховочную клипсу на одежде.","Запустите дорожку на минимальной скорости. Перейдите на полотно лицом к консоли.","Держите корпус прямо и стопы по центру полотна. Скорость и наклон повышайте постепенно.","Снижайте скорость плавно. Сходите только после полной остановки полотна."],"contraindications":["Нестабильные сердечно-сосудистые заболевания, выраженная гипертония, тяжёлые болезни дыхательной системы.","Острые заболевания, травмы, недавние операции; болезни суставов и позвоночника в стадии обострения.","При беременности и хронических заболеваниях режим нагрузки согласуйте с врачом."],"console":["Программа — выбор режима тренировки в ожидании.","Пуск — запуск после установки страховочной клипсы.","Стоп — остановка и сброс.","Скорость +/− — плавная смена скорости.","Наклон +/− — смена наклона.","Цифровые клавиши — быстрый ввод скорости и наклона.","Полумарафон / Марафон — программы дистанции."],"section":"2.1.1"},{"id":"shua-bc-t5517s","file":"Беговая_дорожка_SHUA_BC-T5517S","name":"Беговая дорожка SHUA BC-T5517S","category":"Кардио","hall":"Солнце","limit":"До 145 кг — вес пользователя","muscles":"Ягодичные, квадрицепсы, задняя поверхность бедра, икроножные мышцы.","steps":["Осмотрите дорожку, разомнитесь и наденьте закрытую спортивную обувь.","Встаньте на боковые опоры. Закрепите страховочную клипсу на одежде.","Нажмите START, выберите низкую скорость и только затем перейдите на полотно.","Идите или бегите лицом к консоли; не касайтесь движущихся частей.","Снижайте темп постепенно и сходите после полной остановки."],"contraindications":["Острые травмы ног и позвоночника, недавние операции и воспалительные заболевания.","Тяжёлые или нестабильные сердечно-сосудистые и дыхательные заболевания.","При беременности и хронических заболеваниях нагрузку согласуйте с врачом."],"console":["START — запуск на начальной скорости.","STOP — остановка и режим ожидания.","MODE — настройка времени, калорий и дистанции.","PROGRAM — выбор программы P1–P6.","SPEED +/− — изменение скорости.","INCLINE +/− — изменение наклона.","МАРАФОН — программа дистанции 42,2 км."],"section":"2.1.2"},{"id":"dhz-a-5200","file":"Велотренажёр_вертикальный_DHZ_A-5200","name":"Велотренажёр вертикальный DHZ A-5200","category":"Кардио","hall":"Солнце","limit":"До 150 кг — вес пользователя","muscles":"Квадрицепсы, ягодичные, задняя поверхность бедра и икроножные мышцы.","steps":["Проверьте устойчивость и крепления тренажёра. Сделайте разминку.","До посадки настройте седло: в нижней точке педали колено остаётся слегка согнутым.","Закрепите стопы ремнями педалей; держите спину прямо, плечи расслабьте.","Начните с малого сопротивления и увеличивайте его постепенно; следите за пульсом.","В конце снизьте темп и сопротивление. При боли или недомогании остановитесь."],"contraindications":["Тяжёлые болезни сердца и сосудов, тромбофлебит, острые инфекции.","Острые воспаления суставов и позвоночника, выраженный артроз и свежие травмы.","Беременность и хронические заболевания — после согласования с врачом."],"console":["Быстрый старт — запуск режима тренировки.","Уровень усилия +/− — сопротивление от 1 до 15.","Пауза — временная остановка отсчёта и нагрузки.","Стоп — завершение и сброс в режим ожидания."],"section":"2.2"},{"id":"dhz-x-9201","file":"Эллиптический_тренажёр_DHZ_X-9201","name":"Эллиптический тренажёр DHZ X-9201","category":"Кардио","hall":"Солнце","limit":"До 150 кг — вес пользователя","muscles":"Квадрицепсы, ягодичные, задняя поверхность бедра, икры; при работе рукоятками — мышцы рук и спины.","steps":["Осмотрите педали и рукоятки; разомнитесь 5–7 минут.","Поставьте стопы по центру педалей и возьмитесь за рукоятки обеими руками.","Держите корпус прямо, колени слегка согнутыми. Начните с малого сопротивления.","Двигайте рукоятки синхронно с ногами; не переносите на них весь вес тела.","Плавно снизьте нагрузку и дождитесь полной остановки педалей перед сходом."],"contraindications":["Острые инфекции, травмы, послеоперационный период.","Нестабильные болезни сердца, неконтролируемая гипертония, тромбоз.","При болезнях суставов или позвоночника и при беременности требуется консультация врача."],"console":["Start — быстрый пуск или запуск программы.","Stop — пауза; повторное нажатие завершает тренировку.","Mode — выбор и подтверждение параметров.","Сопротивление +/− — изменение нагрузки.","HILL, CARDIO, STRENGTH, INTERVAL — программы.","3, 6, 9, 12, 15 — быстрый выбор сопротивления."],"section":"2.3"},{"id":"crossover-e1016b","file":"Кроссовер_E-1016B","name":"Регулируемый кроссовер E-1016B","category":"Грузоблочные","hall":"Солнце","limit":"Два грузовых стека до 95 кг","muscles":"Зависит от упражнения: грудь, спина, руки, ноги, ягодичные и мышцы корпуса.","steps":["Проверьте тросы, фиксаторы, штекер груза и карабин.","Выставьте одинаковую нагрузку с обеих сторон и устойчиво поставьте ноги.","Оставьте свободную зону не менее 0,6 м с каждой стороны.","Двигайтесь плавно и контролируйте возврат рукоятки; не бросайте трос."],"contraindications":["Острые заболевания сердца, сосудов, суставов или позвоночника.","После операции или травмы — только с разрешения врача."],"console":[],"section":"3.1"},{"id":"gravitron-u3009d","file":"Гравитрон_U3009D","name":"Гравитрон U3009D","category":"Грузоблочные","hall":"Солнце","limit":"До 99 кг — нагрузка противовеса","muscles":"Подтягивания: спина и бицепсы. Брусья: грудь, трицепсы и передние дельты.","steps":["Проверьте платформу и грузовой стек; установите подходящий противовес.","Возьмитесь за перекладину или брусья и осторожно встаньте коленями на платформу.","Поднимайтесь и опускайтесь без рывков, сохраняя контроль корпуса.","Не допускайте попадания рук, ног и одежды в движущийся механизм."],"contraindications":["Острые травмы плеч, локтей и запястий.","Ограниченная подвижность плеч, выраженные нарушения осанки и обострение болезней позвоночника.","Сердечно-сосудистые заболевания — после консультации врача."],"console":[],"section":"3.2"},{"id":"dhz-u3021d","file":"Сведение_и_разведение_ног_DHZ_U3021D","name":"Сведение и разведение ног DHZ U3021D","category":"Грузоблочные","hall":"Солнце","limit":"До 93 кг — нагрузка блока","muscles":"Сведение: приводящие мышцы бедра. Разведение: отводящие мышцы бедра, средние и малые ягодичные.","steps":["Проверьте тросы и фиксаторы. Настройте ширину упоров и положение подушек.","Сядьте на сиденье, не наступая на нижний трос; прижмите таз и спину.","Сводите или разводите ноги плавно, без помощи корпусом и без рывков.","На возврате удерживайте груз под контролем; не бросайте стек."],"contraindications":["Острые травмы паха, таза, коленей или поясницы.","Воспаление приводящих сухожилий, артрит тазобедренных и коленных суставов.","После операций, при беременности и выраженном варикозе — только после консультации врача."],"console":[],"section":"3.3"},{"id":"dhz-u3086d","file":"Разгибание_и_сгибание_ног_DHZ_U3086D","name":"Разгибание и сгибание ног DHZ U3086D","category":"Грузоблочные","hall":"Солнце","limit":"До 110 кг — нагрузка блока","muscles":"Разгибание: квадрицепсы. Сгибание: мышцы задней поверхности бедра.","steps":["Настройте сиденье и валики так, чтобы колено совпадало с осью тренажёра.","Прижмите спину к спинке, таз — к сиденью. Подберите вес без потери техники.","Разгибайте или сгибайте ноги плавно; не выпрямляйте колени до упора.","Опускайте груз подконтрольно; при боли в колене прекратите упражнение."],"contraindications":["Острая боль и воспаление коленных суставов, травмы менисков и связок.","Ранний период после операции на колене, острый тендинит надколенника.","При выраженном варикозе и травмах голеностопа требуется консультация врача."],"console":[],"section":"3.4"},{"id":"dhz-u3007d","file":"Баттерфляй_задние_дельты_DHZ_U3007D","name":"Баттерфляй / задние дельты DHZ U3007D","category":"Грузоблочные","hall":"Солнце","limit":"До 110 кг — нагрузка блока","muscles":"Сведение: грудные мышцы и передние дельты. Обратное разведение: задние дельты и мышцы верхней части спины.","steps":["Разомните плечи; отрегулируйте сиденье так, чтобы рукоятки были на уровне плеч.","Выберите умеренный вес, прижмите корпус к опоре и возьмитесь за рукоятки.","Сводите или разводите руки плавно, не поднимайте плечи и не бросайте груз.","Контролируйте возврат без чрезмерного растяжения плечевого сустава."],"contraindications":["Острые травмы или воспаления плечевых и локтевых суставов.","Боль в области дельтовидной мышцы; при старых повреждениях нагрузку согласуйте со специалистом."],"console":[],"section":"3.5"},{"id":"dhz-e1085b","file":"Тяга_сверху_и_гребная_DHZ_E-1085B","name":"Тяга сверху / гребная тяга DHZ E-1085B","category":"Грузоблочные","hall":"Солнце","limit":"До 110 кг — нагрузка блока","muscles":"Широчайшие, ромбовидные, трапециевидные, задние дельты, бицепсы; мышцы корпуса стабилизируют положение.","steps":["Проверьте трос, штекер и рукоятки; настройте сиденье и фиксаторы коленей.","Для верхней тяги возьмитесь чуть шире плеч и тяните рукоятку к верхней части груди.","Для гребной тяги держите спину нейтральной и тяните рукоятку к корпусу.","Во всех вариантах двигайтесь без рывков и возвращайте груз медленно."],"contraindications":["Острые травмы плеч и локтей, обострение грыж позвоночника.","Ограничение подвижности плеч и выраженные болезни позвоночника.","При гипертонии, болезнях сердца и дыхательной системы нужна консультация врача."],"console":[],"section":"3.6"},{"id":"smith-e7063","file":"Машина_Смита_E7063","name":"Машина Смита E7063","category":"Свободные веса","hall":"Солнце","limit":"До 200 кг — нагрузка на гриф; пустой гриф 20 кг","muscles":"Зависит от упражнения: ноги, ягодичные, грудь, плечи и руки.","steps":["Проверьте раму, направляющие, фиксаторы и страховочные упоры.","Выставьте упоры под упражнение; нагружайте стороны грифа симметрично и используйте замки.","Снимайте гриф с фиксаторов только в устойчивом положении; двигайтесь без рывков.","После подхода надёжно закрепите гриф на штатных упорах."],"contraindications":["Острые травмы позвоночника, коленей и плеч.","Обострение грыж, артрита и артроза; недавние переломы и операции.","При болезнях сердца, варикозе и беременности нужна консультация врача."],"console":[],"section":"4.6"},{"id":"leg-press-e1056b","file":"Жим_ногами_E-1056B","name":"Жим ногами E-1056B","category":"Свободные веса","hall":"Солнце","limit":"До 250 кг — платформа; пустая платформа 95 кг","muscles":"Квадрицепсы, ягодичные, задняя поверхность бедра и приводящие мышцы.","steps":["Настройте спинку; плотно прижмите к ней голову, таз и поясницу.","Поставьте стопы на платформу на ширине плеч и снимите страховочные упоры.","Выжимайте платформу плавно; колени не разгибайте до конца и не сводите внутрь.","Опускайте платформу подконтрольно, не отрывая таз; затем верните упоры."],"contraindications":["Острые травмы коленей, тазобедренных суставов и позвоночника.","Обострение грыж и протрузий, тяжёлый варикоз, высокое давление.","Беременность — после консультации врача."],"console":[],"section":"4.7"},{"id":"tbar-e7061","file":"Тяга_Т-грифа_E7061","name":"Тяга Т-грифа E7061","category":"Свободные веса","hall":"Солнце","limit":"До 200 кг — нагрузка на гриф; пустой гриф 30 кг","muscles":"Широчайшие, ромбовидные, трапециевидные, задние дельты и бицепсы.","steps":["Нагружайте гриф симметрично и проверьте фиксацию дисков.","Встаньте на платформу, прижмите грудь к подушке, держите поясницу нейтральной.","Тяните рукоятки к корпусу плавно, сводя лопатки.","Опускайте вес медленно, не отрывайте грудь от опоры."],"contraindications":["Травмы поясницы, грыжи и острые боли позвоночника.","Сердечно-сосудистые и выраженные суставные заболевания — после консультации врача."],"console":[],"section":"4.8"},{"id":"hip-thrust-a608","file":"Ягодичный_мостик_A608","name":"Ягодичный мостик A608","category":"Свободные веса","hall":"Солнце","limit":"До 150 кг — нагрузка; пустой тренажёр 20 кг","muscles":"Большие, средние и малые ягодичные; задняя поверхность бедра.","steps":["Проверьте крепления и ремень; настройте опору под свой рост.","Расположите спину на опоре, зафиксируйте корпус ремнём, стопы поставьте на платформу.","Поднимите таз за счёт ягодичных мышц, сохраняя нейтральную поясницу.","Опускайте таз плавно; не бросайте рычаг и не допускайте боли."],"contraindications":["Острые травмы коленей, тазобедренных суставов и поясницы.","Заболевания позвоночника и суставов в стадии обострения."],"console":[],"section":"4.9"},{"id":"glute-940","file":"Глют-машина_940","name":"Глют-машина 940","category":"Свободные веса","hall":"Солнце","limit":"До 150 кг на рычаг; пустой рычаг 15 кг","muscles":"Ягодичные; при разгибании ноги также работает задняя поверхность бедра.","steps":["Настройте сиденье и опоры под рост; убедитесь, что рычаг и диски закреплены.","Займите устойчивое положение, прижмите корпус к опоре.","Выполняйте разгибание плавно, без прогиба в пояснице и без рывков.","Возвращайте рычаг под контролем; не расслабляйте мышцы в нижней точке."],"contraindications":["Травмы коленей, тазобедренных суставов или поясницы.","Болезни позвоночника, сердечно-сосудистые заболевания, беременность — после консультации врача."],"console":[],"section":"4.10"},{"id":"chest-press-910","file":"Широкий_жим_от_груди_910","name":"Широкий жим от груди 910","category":"Свободные веса","hall":"Солнце","limit":"До 300 кг суммарно — по 150 кг на рычаг","muscles":"Большие и малые грудные мышцы, передние дельты и трицепсы.","steps":["Проверьте крепление дисков; настройте сиденье и спинку.","Сядьте устойчиво и плотно прижмите спину к опоре; возьмитесь широким хватом.","На выдохе выжимайте рукоятки без полного запирания локтей.","Верните рычаги медленно, не допускайте болезненного растяжения плеч."],"contraindications":["Сердечно-сосудистые заболевания.","Обострение болезней позвоночника, плечевых, локтевых и кистевых суставов.","Беременность и острые воспалительные процессы — после консультации врача."],"console":[],"section":"4.11"},{"id":"power-rack-a3081","file":"Силовая_рама_и_помост_A3081","name":"Силовая рама и помост A3081","category":"Свободные веса","hall":"Солнце","limit":"Рама до 500 кг; сброс на помост до 300 кг с учётом веса клиента и грифа","muscles":"Зависит от упражнения и выбранного отягощения.","steps":["Проверьте болты рамы, помост, страховочные упоры и замки грифа.","Выставьте крюки и страховочные упоры под рост и выбранное упражнение.","Нагружайте гриф симметрично и фиксируйте диски замками.","Снимайте и возвращайте штангу по центру рамы под контролем.","Сбрасывайте штангу только на резиновые зоны помоста, вдали от людей."],"contraindications":["Острые заболевания сердца, сосудов, суставов или позвоночника.","После операции или травмы — только с разрешения врача."],"console":[],"section":"4.12"},{"id":"bench-abs-e7037","file":"Скамья_для_пресса_E-7037","name":"Регулируемая скамья для пресса E-7037","category":"Свободные веса","hall":"Солнце","limit":"До 150 кг — вес пользователя","muscles":"Прямые и косые мышцы живота.","steps":["Проверьте устойчивость скамьи и зафиксируйте выбранный угол наклона.","Зафиксируйте ноги валиками у ахиллова сухожилия, без давления на сустав.","Поднимайте корпус силой мышц живота, не тяните голову руками.","Опускайтесь плавно; при боли в пояснице уменьшите угол или прекратите подход."],"contraindications":["Травмы и заболевания позвоночника, грыжи.","Болезни сердца и сосудов, острые воспаления, недавние операции, беременность."],"console":[],"section":"4.13"},{"id":"hyperextension-e7045","file":"Гиперэкстензия_E-7045","name":"Гиперэкстензия E-7045","category":"Свободные веса","hall":"Солнце","limit":"До 150 кг — вес пользователя","muscles":"Разгибатели спины, ягодичные и задняя поверхность бедра.","steps":["Проверьте устойчивость тренажёра; выставьте верх подушки ниже костей таза.","Закрепите ноги под валиками, сохраняя свободный сгиб в тазобедренных суставах.","Опускайте и поднимайте корпус плавно с нейтральной спиной.","Не переразгибайтесь в верхней точке и не используйте рывки."],"contraindications":["Обострение грыж, протрузий и других заболеваний позвоночника.","Тяжёлые болезни сердца, выраженный остеопороз, послеоперационный период.","При беременности требуется консультация врача."],"console":[],"section":"4.14"},{"id":"dip-press-e7047","file":"Брусья_пресс_E-7047","name":"Брусья-пресс E-7047","category":"Свободные веса","hall":"Солнце","limit":"До 150 кг — вес пользователя","muscles":"Подъём ног: прямые и косые мышцы живота. Отжимания: грудь и трицепсы.","steps":["Проверьте устойчивость рамы и покрытие рукояток.","Для отжиманий возьмитесь за брусья, удерживайте корпус устойчиво и сгибайте руки плавно.","Для подъёма ног прижмите предплечья к опорам и поднимайте ноги силой пресса.","Не раскачивайте корпус; спускайтесь под контролем."],"contraindications":["Травмы плечевых, локтевых или коленных суставов.","Болезни сердца, гипертония, обострение грыж и болезней позвоночника.","Беременность и недавние операции."],"console":[],"section":"4.15"},{"id":"pilates-reformer","file":"Пилатес_Реформер","name":"Реформер","category":"Пилатес","hall":"Земля","limit":"До 100 кг — вес пользователя","muscles":"Зависит от упражнения и настройки пружин; нагрузку подбирает тренер.","steps":["Занимайтесь только с тренером после первичного тестирования.","Проверьте крепления каретки, пружин и ремней вместе с тренером.","Займите положение, которое показал тренер; не меняйте сопротивление самостоятельно.","Выполняйте движения плавно, контролируя возвращение каретки."],"contraindications":["Острые заболевания сердца, сосудов, суставов или позвоночника.","После операции или травмы — только с разрешения врача."],"console":[],"section":"5.1"},{"id":"pilates-cadillac","file":"Пилатес_Кадиллак","name":"Кадиллак (трапеция)","category":"Пилатес","hall":"Земля","limit":"До 200 кг — вес пользователя; трапеция до 118 кг","muscles":"Зависит от упражнения и подвеса; нагрузку подбирает тренер.","steps":["Занимайтесь только с тренером после первичного тестирования.","Перед занятием вместе с тренером проверьте крепления трапеции, пружин и ремней.","Используйте только назначенные точки опоры и положение тела.","Двигайтесь плавно; не меняйте подвес и пружины без тренера."],"contraindications":["Острые заболевания сердца, сосудов, суставов или позвоночника.","После операции или травмы — только с разрешения врача."],"console":[],"section":"5.2"},{"id":"pilates-chair","file":"Пилатес_Стул_Wunda_Chair","name":"Стул Wunda Chair","category":"Пилатес","hall":"Земля","limit":"До 100 кг — вес пользователя","muscles":"Зависит от упражнения; обычно мышцы корпуса и ног.","steps":["Занимайтесь только с тренером после первичного тестирования.","Проверьте фиксацию пружин и устойчивость стула вместе с тренером.","Держите равновесие с опорой на ручки, если это предписано упражнением.","Нажимайте на педаль и отпускайте её плавно, без рывков."],"contraindications":["Острые заболевания сердца, сосудов, суставов или позвоночника.","После операции или травмы — только с разрешения врача."],"console":[],"section":"5.3"},{"id":"pilates-barrel","file":"Пилатес_Бочка_Ladder_Barrel","name":"Бочка Ladder Barrel","category":"Пилатес","hall":"Земля","limit":"До 120 кг — вес пользователя","muscles":"Мышцы корпуса и спины; конкретный акцент зависит от упражнения.","steps":["Занимайтесь только с тренером после первичного тестирования.","Проверьте устойчивость бочки и лестницы, настройте расстояние между ними.","Займите положение на дуге и перекладинах по указанию тренера.","Растягивайтесь и возвращайтесь плавно, без резкого прогиба позвоночника."],"contraindications":["Острые заболевания сердца, сосудов, суставов или позвоночника.","После операции или травмы — только с разрешения врача."],"console":[],"section":"5.4"},{"id":"pilates-spine-arc","file":"Пилатес_Арка_для_спины","name":"Арка для спины (спайн-корректор)","category":"Пилатес","hall":"Земля","limit":"До 100 кг — вес пользователя","muscles":"Зависит от упражнения; мышцы корпуса, спины и стабилизаторы.","steps":["Занимайтесь только с тренером после первичного тестирования.","Установите арку на ровную поверхность и проверьте её устойчивость.","Расположите корпус на опоре так, как показал тренер.","Двигайтесь медленно, без боли и резкого переразгибания спины."],"contraindications":["Острые заболевания сердца, сосудов, суставов или позвоночника.","После операции или травмы — только с разрешения врача."],"console":[],"section":"5.5"}]</script>
<script>
const machines=JSON.parse(document.getElementById("equipment-data").textContent);
const app=document.getElementById("app");
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const list=a=>"<ul>"+a.map(x=>"<li>"+esc(x)+"</li>").join("")+"</ul>";
const categories=["Все","Кардио","Грузоблочные","Свободные веса","Пилатес"];
const selected=new URLSearchParams(location.search).get("id");
const item=machines.find(m=>m.id===selected);
if(selected){
  if(!item){app.innerHTML='<div class="glass detail"><h1>Тренажёр не найден</h1><p class="lead">Проверьте ссылку на QR-код.</p><div class="actions"><a class="btn primary" href="tb.html">Все тренажёры</a><a class="btn" href="index.html">На главный сайт</a></div></div>'}
  else{
    document.title=item.name+" · ТБ · ФЦ «Космос»";
    app.innerHTML='<article class="glass detail"><div class="detail-head"><div><span class="tag">'+esc(item.category)+' · Зал «'+esc(item.hall)+'»</span><h1>'+esc(item.name)+'</h1></div></div>'
      +'<div class="weight"><span class="label">Ограничение по весу / нагрузке</span>'+esc(item.limit)+'</div>'
      +'<div class="section"><h2>Рабочие мышцы</h2><p>'+esc(item.muscles)+'</p></div>'
      +'<div class="section"><h2>Техника безопасности</h2><ol>'+item.steps.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ol></div>'
      +(item.console.length?'<div class="section"><h2>Кнопки консоли</h2>'+list(item.console)+'</div>':'')
      +'<div class="section"><h2>Противопоказания</h2>'+list(item.contraindications)+'</div>'
      +'<div class="notice">Если появилась боль, головокружение или слабость, прекратите занятие и обратитесь к сотруднику клуба. При сомнениях о допустимой нагрузке проконсультируйтесь с врачом.</div>'
      +'<div class="actions"><a class="btn primary" href="tb.html">Все тренажёры</a><a class="btn" href="index.html">На главный сайт</a></div></article>';
  }
}else{
  app.innerHTML='<h1>Техника <span class="accent">безопасности</span></h1><p class="lead">Выберите тренажёр. Инструкции подготовлены по Приложению №2 к правилам фитнес-центра «Космос».</p>'
    +'<div class="glass toolbar"><input id="search" type="search" aria-label="Поиск тренажёра" placeholder="Поиск по названию или модели"><select id="hall" aria-label="Зал"><option value="all">Все залы</option><option value="Солнце">Зал «Солнце»</option><option value="Земля">Зал «Земля»</option></select></div>'
    +'<div class="chips" role="group" aria-label="Категория">'+categories.map((c,i)=>'<button class="chip" type="button" data-cat="'+esc(c)+'" aria-pressed="'+(i===0)+'">'+esc(c)+'</button>').join('')+'</div>'
    +'<div id="count" class="lead" role="status"></div><div id="cards" class="grid"></div>';
  let category="Все";
  const cards=document.getElementById("cards"),count=document.getElementById("count");
  function render(){
    const q=document.getElementById("search").value.trim().toLocaleLowerCase("ru");
    const hall=document.getElementById("hall").value;
    const hits=machines.filter(m=>(category==="Все"||m.category===category)&&(hall==="all"||m.hall===hall)&&(!q||(m.name+" "+m.id+" "+m.limit).toLocaleLowerCase("ru").includes(q)));
    count.textContent="Найдено: "+hits.length+" из "+machines.length;
    cards.innerHTML=hits.length?hits.map(m=>'<a class="glass tile" href="tb.html?id='+encodeURIComponent(m.id)+'"><span class="tag">'+esc(m.category)+'</span><h3>'+esc(m.name)+'</h3><div class="limit">'+esc(m.limit)+'</div><div class="hall">Зал «'+esc(m.hall)+'» · Открыть инструкцию ↗</div></a>').join(''):'<div class="glass empty">Ничего не найдено. Попробуйте другое название.</div>';
  }
  document.getElementById("search").addEventListener("input",render);
  document.getElementById("hall").addEventListener("change",render);
  document.querySelector(".chips").addEventListener("click",e=>{const b=e.target.closest("[data-cat]");if(!b)return;category=b.dataset.cat;document.querySelectorAll("[data-cat]").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));render()});
  render();
}
</script>

</html>
