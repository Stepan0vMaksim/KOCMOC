:root{color-scheme:dark;--ink:#04030a;--line:#2b2145;--vio:#8a4dff;--vio2:#c3a8ff;--sun:#ffc629;--txt:#f4f1fb;--mut:#b2abc6;--wide:"Unbounded","Arial Black",Verdana,sans-serif;--glass:rgba(150,110,255,.12);--edge:rgba(215,195,255,.55)}
*{box-sizing:border-box;margin:0;padding:0}

.sv{margin-top:22px;font:500 clamp(18px,4.6vw,24px)/1.35 var(--wide);text-align:center}
.sv strong{display:block;font:700 clamp(30px,8.5vw,52px) var(--wide);color:var(--sun);text-shadow:0 0 24px rgba(255,198,41,.4);margin:6px 0}
.back{display:inline-block;margin-bottom:10px;color:var(--vio2);font-weight:700;text-decoration:none}

/* why circles */
.cir{display:grid;gap:36px;margin-top:34px}
.cir img{width:118px;height:118px;border-radius:50%;object-fit:cover;margin:0 auto 14px;border:3px solid var(--edge);box-shadow:0 0 26px rgba(138,77,255,.55);animation:fl 7s ease-in-out infinite}
.cir>div:nth-child(2) img{animation-delay:-2s}.cir>div:nth-child(3) img{animation-delay:-4s}
.cir h3{font:500 18px var(--wide);margin-bottom:8px}
.cir p{color:var(--mut);font-size:15.5px;max-width:23em;margin:0 auto}
@media(min-width:800px){.cir{grid-template-columns:repeat(3,1fr)}}

/* gallery */
.gal{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:30px}
.gal button{border:1.5px solid var(--edge);padding:0;background:#000;border-radius:20px;overflow:hidden;cursor:zoom-in;aspect-ratio:4/3;transition:transform .45s cubic-bezier(.2,.8,.3,1),box-shadow .45s}
.gal button:hover{transform:translateY(-8px);box-shadow:0 0 26px rgba(138,77,255,.65)}
.gal img{width:100%;height:100%;object-fit:cover}
@media(min-width:800px){.gal{grid-template-columns:repeat(4,1fr)}}
dialog{border:0;background:transparent;max-width:100vw;max-height:100vh;width:100%;height:100%;padding:12px;margin:0}
dialog::backdrop{background:rgba(0,0,0,.94)}
dialog img{position:absolute;inset:12px;width:calc(100% - 24px);height:calc(100% - 24px);object-fit:contain;border-radius:8px}
dialog .cls{position:absolute;top:calc(env(safe-area-inset-top,0px) + 16px);right:16px;z-index:2}
dialog .btn{min-height:48px;padding:0 22px;background:var(--sun);color:#1a1200;animation:none}
.nv{position:absolute;top:50%;z-index:3;width:56px;height:56px;margin-top:-28px;border-radius:50%;border:2px solid var(--vio2);background:rgba(4,3,10,.7);color:#fff;font:700 28px/1 system-ui;cursor:pointer;box-shadow:0 0 20px var(--vio)}
.nv.p{left:10px}.nv.n{right:10px}
.cnt{position:absolute;left:16px;top:calc(env(safe-area-inset-top,0px) + 28px);z-index:3;font-weight:700}

/* faq */
.faq{max-width:720px;margin:30px auto 0;text-align:left}
details{border-bottom:1px solid var(--line)}
summary{list-style:none;cursor:pointer;padding:20px 44px 20px 0;font-weight:700;font-size:18px;position:relative;min-height:58px}
summary::-webkit-details-marker{display:none}
summary:after{content:"+";position:absolute;right:4px;top:50%;transform:translateY(-50%);font:500 28px var(--wide);color:var(--sun);transition:transform .2s}
details[open] summary:after{transform:translateY(-50%) rotate(45deg)}
details p{padding:0 0 20px;color:#d3cde4}

/* faq */
.qa{border:1px solid var(--line);border-radius:20px;background:rgba(138,77,255,.05);margin-bottom:12px;transition:border-color .3s,box-shadow .3s,background .3s}
.qa.open{border-color:var(--edge);background:var(--glass);box-shadow:0 0 28px rgba(138,77,255,.35)}
.q{width:100%;display:flex;align-items:center;gap:16px;padding:16px 18px;background:none;border:0;color:var(--txt);text-align:left;font:700 18px/1.3 system-ui,sans-serif;cursor:pointer;min-height:72px}
.qn{font:300 30px var(--wide);color:transparent;-webkit-text-stroke:1px var(--vio2);min-width:2.1em}
.qi{margin-left:auto;flex:none;width:36px;height:36px;border-radius:50%;border:1.5px solid var(--vio2);position:relative;transition:transform .35s,background .3s}
.qi:before,.qi:after{content:"";position:absolute;left:50%;top:50%;width:14px;height:2px;margin:-1px 0 0 -7px;background:var(--vio2)}
.qi:after{transform:rotate(90deg)}
.qa.open .qi{transform:rotate(45deg);background:rgba(138,77,255,.35)}
.qa-a{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s ease}
.qa.open .qa-a{grid-template-rows:1fr}
.qa-a>div{overflow:hidden}
.qa-a p{padding:0 20px 22px 18px;color:#e0d9f2;font-size:17px}
@media(min-width:600px){.qa-a p{padding-left:calc(18px + 2.1em + 16px)}}
/* booking */
#bk{width:min(480px,100% - 20px);height:auto;max-height:92vh;margin:auto;padding:0;overflow:auto;color:var(--txt);background:transparent;text-align:left}
#bk .glass{padding:26px 20px 24px;background:#0d0919}
#bk h3{font:500 22px var(--wide);margin-bottom:6px;padding-right:44px}
#bk .x{position:absolute;top:14px;right:14px;width:44px;height:44px;border-radius:50%;border:1.5px solid var(--edge);background:rgba(255,255,255,.08);color:#fff;font:28px/1 system-ui;cursor:pointer}
#bk .btn{display:flex;flex-direction:column;gap:6px;width:100%;margin-top:12px;min-height:66px;text-align:center;line-height:1.2;animation:none}
#bk .btn small{font:500 15px system-ui}
#bk .or{margin:20px 0 4px;color:var(--mut);font-size:15px;text-align:center}
#bk label{display:block;font-size:14px;color:var(--mut);margin:12px 0 6px}
#bk input{width:100%;min-height:56px;padding:0 16px;border-radius:14px;border:1px solid var(--edge);background:rgba(255,255,255,.08);color:var(--txt);font:18px system-ui,sans-serif}
#bk #bm{margin-top:14px;font-size:15px;color:var(--vio2);text-align:center}
#bk #bm.err{color:#ffb4aa}
/* final */
.fin{padding:34px 20px 38px;max-width:760px;margin:34px auto 0}
.fin .info{display:grid;gap:6px;margin:20px 0 26px;font-size:18px}
.fin .info b{color:var(--vio2);font-weight:600;font-size:14px;display:block;margin-top:10px}
.hrs{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;max-width:340px;margin:0 auto}
.hrs span{text-align:right;color:var(--mut)}.hrs strong{text-align:left}
.bts{display:grid;gap:12px;max-width:420px;margin:0 auto}
.dots{display:flex;gap:12px;justify-content:center;margin-top:34px}
.dots i{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.35);animation:dt 3s infinite}
.dots i:nth-child(2){animation-delay:1s}.dots i:nth-child(3){animation-delay:2s}
@keyframes dt{0%,100%{background:rgba(255,255,255,.3);transform:scale(1)}33%{background:#fff;transform:scale(1.35)}}
footer{padding:26px 0;color:var(--mut);font-size:14px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:rgba(4,3,10,.94);border-top:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:10px;transform:translateY(110%);transition:transform .3s}
.bar.on{transform:none}
.bar .btn{min-height:52px;font-size:17px;animation:none}
@media(min-width:900px){.bar{display:none}body{padding-bottom:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

@font-face{font-family:"Supermolot";src:url(assets/content/7bde17f42cd8ab4c9534.bin) format("woff");font-weight:100 900;font-style:normal;font-display:swap}
:root{--wide:"Supermolot",Arial,sans-serif;--f:"Supermolot",Arial,sans-serif}
*,*::before,*::after,button,input,select,textarea{font-family:var(--f)!important;font-weight:400!important;font-style:normal!important}
h2,h1{letter-spacing:.01em}
/* burger + drawer */
.burger{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:12px;z-index:30;width:52px;height:52px;border-radius:50%;border:1.5px solid var(--edge);background:rgba(4,3,10,.75);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);cursor:pointer;display:grid;place-content:center;gap:6px;box-shadow:0 0 22px rgba(138,77,255,.5)}
.burger i{display:block;width:22px;height:2.5px;border-radius:2px;background:#fff}
.ov{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .3s}
.ov.on{opacity:1;pointer-events:auto}
.side{position:fixed;top:0;bottom:0;left:0;z-index:41;width:min(320px,86vw);padding:calc(env(safe-area-inset-top,0px) + 18px) 18px 24px;background:#0d0919;border-right:1px solid var(--edge);box-shadow:0 0 50px rgba(138,77,255,.45);transform:translateX(-105%);transition:transform .35s cubic-bezier(.2,.8,.3,1);display:flex;flex-direction:column;gap:12px;text-align:left;overflow-y:auto}
.side.on{transform:none}
.side .lg{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.side .lg img{width:64px;height:64px;border-radius:16px}
.side .lg span{font-size:22px;line-height:1.1}
.side .sx{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);right:14px;width:44px;height:44px;border-radius:50%;border:1.5px solid var(--edge);background:rgba(255,255,255,.08);color:#fff;font-size:28px;line-height:1;cursor:pointer}
.sl{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:60px;padding:0 20px;border-radius:18px;border:1px solid var(--edge);background:var(--glass);color:var(--txt);font-size:19px;cursor:pointer;text-align:left}
.sl:after{content:"\203A";color:var(--sun);font-size:26px}
.sl:hover,.sl.on{box-shadow:0 0 24px rgba(138,77,255,.7);border-color:var(--sun)}
/* pages */
.page{padding:calc(env(safe-area-inset-top,0px) + 80px) 0 40px;min-height:100vh;min-height:100svh}
.page .back{background:none;border:0;cursor:pointer;font-size:17px;margin-bottom:18px}
.pg{padding:30px 22px;margin-top:26px;text-align:left}
.pg p{margin-bottom:14px;color:#e8e0fb}
.pg p:last-child{margin-bottom:0}
.lst{list-style:none;display:grid;gap:12px;text-align:left;margin-top:26px}
.lst li{padding:16px 18px 16px 52px;position:relative;border-radius:18px;border:1px solid var(--edge);background:var(--glass)}
.lst li:before{content:attr(data-n);position:absolute;left:16px;top:14px;color:var(--sun);font-size:20px}
.sch{display:grid;gap:12px;margin-top:26px}
.sch .row{display:flex;justify-content:space-between;gap:12px;padding:18px 20px;border-radius:18px;border:1px solid var(--edge);background:var(--glass);text-align:left}
.sch .row b{color:var(--vio2)}.sch .row span{color:var(--sun)}
.empty{margin-top:22px;padding:22px;border:1.5px dashed var(--edge);border-radius:18px;color:var(--mut)}
/* trainers carousel */
.car{position:relative;margin-top:34px}
.trk{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;padding:10px 4px 22px;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.trk::-webkit-scrollbar{display:none}
.tr{flex:0 0 min(260px,72%);scroll-snap-align:center;padding:22px 18px 24px;border-radius:24px;border:1.5px solid var(--edge);background:#0b0816;box-shadow:0 0 30px rgba(138,77,255,.3)}
.tr .av{width:150px;height:150px;margin:0 auto 16px;border-radius:50%;border:3px solid var(--edge);background:radial-gradient(circle at 35% 30%,rgba(195,168,255,.35),rgba(138,77,255,.12));display:grid;place-items:center;background-size:cover;background-position:center;box-shadow:0 0 26px rgba(138,77,255,.5);overflow:hidden}
.tr .av svg{width:70%;height:70%;opacity:.55}
.tr h3{font-size:19px;margin-bottom:6px}
.tr p{font-size:15px;color:var(--mut)}
.cb{position:absolute;top:42%;z-index:3;width:48px;height:48px;margin-top:-24px;border-radius:50%;border:2px solid var(--vio2);background:rgba(4,3,10,.8);color:#fff;font-size:26px;line-height:1;cursor:pointer;box-shadow:0 0 18px var(--vio)}
.cb.p{left:-6px}.cb.n{right:-6px}
@media(min-width:900px){.cb.p{left:-22px}.cb.n{right:-22px}}
/* directions */
.dir{max-width:720px;margin:30px auto 0;text-align:left}
.dir .qa-a p{font-size:16px}
.qa .q span:nth-child(2){flex:1}
.hero .tag{font-size:clamp(17px,4.6vw,24px);margin-bottom:12px;color:#fff;text-shadow:0 0 18px rgba(138,77,255,.9)}
/* directions carousel */
.dcar{margin:30px -16px 0}
.dtrk{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;padding:10px 16px 26px;scrollbar-width:none;-webkit-overflow-scrolling:touch;cursor:grab;scroll-padding:0 16px}
.dtrk::-webkit-scrollbar{display:none}.dtrk.drag{cursor:grabbing;scroll-snap-type:none}
.dc{flex:0 0 min(310px,82%);scroll-snap-align:start;border-radius:24px;border:1.5px solid var(--edge);background:#0b0816;overflow:hidden;text-align:left;box-shadow:0 0 30px rgba(138,77,255,.3);user-select:none;-webkit-user-select:none}
.dc .ph{height:190px}
.dc .em{position:absolute;right:14px;bottom:10px;z-index:2;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:26px;background:rgba(4,3,10,.8);border:1.5px solid var(--edge)}
.dc .tx{padding:8px 20px 22px}
.dc h3{font-size:21px;margin-bottom:10px}
.dc p{font-size:15px;color:#ddd5f2;line-height:1.5}
.dcnt{color:var(--mut);font-size:15px}
/* trainers coverflow */
.cf{position:relative;height:400px;margin:20px auto 0;max-width:760px;perspective:1000px;touch-action:pan-y;cursor:grab;user-select:none;-webkit-user-select:none;overflow:hidden}
.cf.drag{cursor:grabbing}
.cf .tr{position:absolute;left:50%;top:10px;width:min(250px,64vw);flex:none;transform-origin:center;will-change:transform}
.cf.anim .tr{transition:transform .45s cubic-bezier(.2,.8,.3,1),opacity .45s}
.cf .tr .av{width:140px;height:140px}
.cf .tr .btn{margin-top:14px;min-height:44px;font-size:15px;padding:0 20px;animation:none}
.dots2{display:flex;gap:10px;justify-content:center;margin-top:8px}
.dots2 i{width:11px;height:11px;border-radius:50%;background:rgba(255,255,255,.3);cursor:pointer;transition:.3s}
.dots2 i.on{background:var(--sun);transform:scale(1.3)}
.rl b{color:var(--sun)}
.rl h3{font-size:20px;margin:6px 0 8px}

.dcar{position:relative}.dtrk{scroll-snap-type:none!important;scroll-behavior:auto}
.dcar .cb.p{left:22px}.dcar .cb.n{right:22px}.dcar .cb{opacity:.85}
.bdg{position:absolute;top:-8px;left:50%;transform:translateX(-50%);padding:5px 14px;border-radius:999px;background:var(--sun);color:#1a1030;font-size:13px;white-space:nowrap}
.dots2 i:nth-child(3){width:14px;height:14px}
.back{display:inline-block;color:inherit;text-decoration:none;font-size:17px;margin-bottom:18px}
.tav{width:180px;height:180px;margin:6px auto 18px;border-radius:50%;border:3px solid var(--edge);background:rgba(138,77,255,.15) center/cover;display:grid;place-items:center;box-shadow:0 0 30px rgba(138,77,255,.5);overflow:hidden}
.tav svg{width:70%;height:70%;opacity:.55}
.rsw{display:grid;gap:18px;margin-top:22px}.rsw .pg{margin-top:0}
.rs h3{font-size:19px;color:var(--sun);margin:18px 0 10px}.rs h3:first-child{margin-top:0}
.rs ul{list-style:none;display:grid;gap:10px}
.rs li{position:relative;padding-left:20px;color:#e8e0fb;font-size:15px;line-height:1.55}
.rs li:before{content:"";position:absolute;left:0;top:.6em;width:7px;height:7px;border-radius:50%;background:var(--vio2)}
.rs p{color:#e8e0fb;font-size:15px;line-height:1.55}
.rs b{color:#fff;background:rgba(138,77,255,.35);padding:0 4px;border-radius:5px}
#bk{position:fixed;inset:0;margin:auto!important;height:fit-content!important}
#bk .glass{text-align:center}
#bk h3{padding-right:0}
.cl{display:grid;gap:14px;margin-top:24px}
@media(min-width:700px){.cl{grid-template-columns:repeat(2,1fr)}}
.cl button{display:flex;align-items:center;gap:16px;width:100%;padding:14px 18px;border-radius:22px;border:1px solid var(--edge);background:var(--glass);color:var(--txt);text-align:left;cursor:pointer;font:inherit;box-shadow:0 0 22px rgba(138,77,255,.25)}
.cl button:hover{border-color:var(--sun);box-shadow:0 0 24px rgba(138,77,255,.7)}
.cl .a{flex:none;width:72px;height:72px;border-radius:50%;border:2px solid var(--edge);background:center/cover}
.cl b{display:block;font-size:18px;font-weight:500;margin-bottom:4px}
.cl span{font-size:14px;color:var(--mut);line-height:1.35}
.rs a{color:var(--sun);font-weight:700}

/* ===== v2: меню, залы, документы, модальные окна ===== */
.hnav{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:12px;margin:14px auto 0;max-width:860px}
.hnav a,.hnav button{display:inline-flex;align-items:center;gap:6px;min-height:42px;padding:0 16px;border-radius:999px;border:1px solid var(--edge);background:rgba(255,255,255,.08);color:var(--txt);font-size:15px;text-decoration:none;cursor:pointer;transition:box-shadow .3s,border-color .3s}

.ofr{margin-top:26px;padding:16px 18px;max-width:560px;display:flex;flex-direction:column;align-items:center;gap:12px}

.orb{position:absolute;left:16px;bottom:12px;z-index:2;width:56px;height:56px;border-radius:50%;box-shadow:0 0 26px rgba(138,77,255,.7);border:1.5px solid var(--edge)}

.age{margin:0 0 16px;padding:12px 14px;border-radius:16px;border:1px dashed var(--edge);background:rgba(138,77,255,.08);font-size:14.5px;color:#ddd5f2}
.age b{display:block;color:var(--vio2);font-weight:400;font-size:13px;margin-bottom:6px}
.age div{padding:4px 0}
.pgrid{display:grid;grid-template-columns:1fr;gap:8px;margin:0 0 16px}
.pgrid div{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 14px;border-radius:14px;border:1px solid var(--edge);background:rgba(255,255,255,.06);font-size:14px;line-height:1.35}
.pgrid strong{flex:none;font-size:19px;color:var(--sun);white-space:nowrap}
.pgrid small{display:block;color:var(--mut);font-size:12.5px}
.tile .pr.ask{border-top:0}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.acts .btn{min-height:46px;padding:0 10px;font-size:15px;animation:none}

#md{position:fixed;inset:0;margin:auto!important;width:min(780px,100% - 20px);height:fit-content!important;max-height:92vh;padding:0;overflow:auto;color:var(--txt);background:transparent;text-align:left}

#md .x{position:absolute;top:14px;right:14px;width:44px;height:44px;border-radius:50%;border:1.5px solid var(--edge);background:rgba(255,255,255,.08);color:#fff;font-size:28px;line-height:1;cursor:pointer}
#md h3{font-size:22px;margin-bottom:6px;padding-right:50px}
#md .lead{color:var(--mut);font-size:15px;margin-bottom:6px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
.tabs button{min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--edge);background:rgba(255,255,255,.07);color:var(--txt);font-size:14.5px;cursor:pointer}
.tabs button.on{background:var(--sun);color:#1a1200;border-color:var(--sun)}
.mbtn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 20px;border-radius:999px;border:2px solid var(--sun);background:var(--sun);color:#1a1200;font-size:16px;text-decoration:none;cursor:pointer}
.mbtn.g{background:var(--glass);border-color:var(--edge);color:var(--txt)}
.mrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px;justify-content:center}
#md .cl{margin-top:14px}
.mdc{display:grid;gap:14px;margin-top:14px}
@media(min-width:640px){.mdc{grid-template-columns:1fr 1fr}}
.mdc article{border-radius:20px;border:1.5px solid var(--edge);background:#0b0816;overflow:hidden}
.mdc .ph{height:130px}
.mdc .tx{padding:4px 16px 16px}
.mdc h4{font-size:18px;font-weight:400;margin-bottom:6px}
.mdc p{font-size:14px;line-height:1.5;color:#ddd5f2}
.psec{margin-top:18px;padding:16px;border-radius:18px;border:1px solid var(--edge);background:rgba(255,255,255,.05)}
.psec h4{font-size:18px;color:var(--sun);font-weight:400;margin-bottom:8px}
.psec .pgrid{margin:0}
.psec .note{font-size:13.5px;color:var(--mut);margin-top:10px}
.sgrid{display:grid;gap:8px;margin-top:14px}
@media(min-width:640px){.sgrid{grid-template-columns:repeat(4,1fr)}}
.sday{padding:12px;border-radius:16px;border:1px solid var(--edge);background:rgba(255,255,255,.05);min-height:90px}
.sday.today{border-color:var(--sun);box-shadow:0 0 18px rgba(255,198,41,.25)}
.sday>b{display:block;color:var(--vio2);font-weight:400;font-size:14px;margin-bottom:8px}
.sday .none{font-size:13px;color:var(--mut)}
.slot{display:block;width:100%;text-align:left;margin-top:6px;padding:8px 10px;border-radius:12px;border:1px solid var(--edge);background:rgba(138,77,255,.14);color:var(--txt);font-size:13.5px;line-height:1.3;cursor:pointer}
.slot:hover{border-color:var(--sun)}
.slot strong{color:var(--sun);font-weight:400}
.slot em{display:block;font-style:normal;color:var(--mut);font-size:12.5px}
.slot span{display:block;margin-top:4px;color:var(--vio2);font-size:12.5px}
.empty2{margin-top:14px;padding:16px;border:1.5px dashed var(--edge);border-radius:16px;color:var(--mut);font-size:14.5px}
@media(min-width:900px){#md .glass{padding:30px 28px 28px}}

/* ===== v3: залы — по одному «слайду» на экран ===== */
.tiles{display:block;margin-top:10px}
.hall{position:relative;min-height:100vh;min-height:100svh;display:flex;align-items:center;justify-content:center;padding:48px 0 64px;scroll-margin-top:0}
.hall:before{content:"";position:absolute;left:50%;top:50%;width:min(900px,140vw);aspect-ratio:1;translate:-50% -50%;border-radius:50%;background:radial-gradient(circle,var(--gl) 0,transparent 62%);opacity:.38;pointer-events:none;z-index:-1}
.hall-sun{--gl:#ffb300}.hall-moon{--gl:#9d8cff}.hall-earth{--gl:#2f9bff}
.hall-in{width:100%;display:grid;gap:14px;justify-items:center;align-items:center;opacity:0;transform:translateY(46px);transition:opacity .8s ease,transform .8s cubic-bezier(.2,.8,.3,1)}
.hall-in.in{opacity:1;transform:none}
.hall-orb{text-align:center}
.hall-orb svg{width:clamp(150px,42vw,380px);height:auto;overflow:visible;filter:drop-shadow(0 0 40px var(--gl));animation:fl 7s ease-in-out infinite}
.hall-earth .hall-orb svg{animation-delay:-3s}.hall-moon .hall-orb svg{animation-delay:-1.5s}
.rays{transform-origin:100px 100px;animation:spin 38s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tw2{animation:tws 2.6s ease-in-out infinite}.tw2:nth-of-type(2n){animation-delay:-1.3s}
@keyframes tws{50%{opacity:.25;transform:scale(.7)}}
.hn{font:300 clamp(36px,9vw,64px)/1 var(--wide);text-shadow:0 0 20px var(--gl);margin-top:6px}
.hn small{font-size:.45em;color:var(--mut);margin-left:4px}
.hl{font-size:14px;color:var(--vio2);letter-spacing:.14em;text-transform:uppercase;margin-top:4px}
.hall .tile{max-width:540px;width:100%;box-shadow:0 0 50px rgba(138,77,255,.4);box-shadow:0 0 50px color-mix(in srgb,var(--gl) 45%,transparent);border-color:color-mix(in srgb,var(--gl) 55%,white)}
.hall .ph{height:190px}
.hnext{position:absolute;left:50%;bottom:12px;translate:-50% 0;width:52px;height:52px;font-size:24px;color:#fff}

/* ===== v4: залы — страницы на всю ширину, без планет и обводки ===== */
.hall{width:100vw;margin-left:calc(50% - 50vw);min-height:100vh;min-height:100svh;padding:0;display:block;background:rgba(4,3,10,.93)}
.hall-even{background:rgba(14,9,30,.93)}
.hall:before{display:none}
.hall-in{display:flex;flex-direction:column;align-items:stretch;justify-items:stretch;gap:0;width:100%;min-height:100vh;min-height:100svh}
.hall .ph{height:40svh;min-height:230px;flex:none;border-radius:0}
.hall .ph:after{height:120px;background:linear-gradient(to top,#07050f,rgba(7,5,15,0))}
.hall .tile{border:0;box-shadow:none;border-radius:0;background:transparent;max-width:none;width:100%;overflow:visible;flex:1}
.hall .tx{max-width:580px;margin:0 auto;padding:6px 20px 96px;width:100%}
.hall .tile h3{font-size:clamp(26px,7vw,38px);line-height:1.15;margin-bottom:18px}
.hall .tile h3 small{font-size:.45em}
.hall .tile ul{font-size:16px;gap:10px;margin-bottom:20px}
.hnext{bottom:20px;border-width:1px;background:rgba(138,77,255,.18);box-shadow:none;width:48px;height:48px}

/* ===== v5 ===== */
.feat{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}
.feat span{padding:7px 14px;border-radius:999px;background:rgba(255,255,255,.1);font-size:14.5px;color:#fff}
.feat span.d{background:rgba(138,77,255,.28)}
.who{font-size:15px;color:var(--vio2);margin:-6px 0 16px}
.key{margin:0 0 18px;padding:14px 16px;border-radius:16px;background:rgba(255,198,41,.13);font-size:16px;line-height:1.5;color:#fff}
.psec .note{font-size:16px;line-height:1.5;color:#fff;background:rgba(255,198,41,.13);padding:13px 16px;border-radius:14px;margin-top:12px}
.psec h4{font-size:20px}
#md .lead{font-size:16px}
.pgrid div{font-size:15.5px}.pgrid small{font-size:13.5px}
#md.wide{width:min(1000px,100% - 20px)}
.sfr{display:block;width:100%;height:66vh;min-height:360px;border:0;border-radius:14px;background:#fff;margin-top:14px}
.fab{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:25;display:flex;flex-direction:column;align-items:flex-end;gap:10px;transition:bottom .3s}
@media(max-width:899px){.bar.on~.fab{bottom:calc(86px + env(safe-area-inset-bottom,0px))}}
.fab-main{width:60px;height:60px;border-radius:50%;border:0;background:var(--sun);color:#1a1200;display:grid;place-items:center;cursor:pointer;box-shadow:0 6px 24px rgba(0,0,0,.5);animation:ring 3s ease-out infinite}
.fab-main svg{width:28px;height:28px;transition:transform .25s}
.fab-main .x{display:none}.fab.open .fab-main .c{display:none}.fab.open .fab-main .x{display:block}
.fab-list{display:grid;gap:8px;justify-items:end;opacity:0;transform:translateY(12px) scale(.96);pointer-events:none;transition:opacity .2s,transform .2s}
.fab.open .fab-list{opacity:1;transform:none;pointer-events:auto}
.fab-list a,.fab-list button{display:inline-flex;align-items:center;gap:10px;min-height:48px;padding:0 20px 0 14px;border-radius:999px;border:1px solid var(--edge);background:#0d0919;color:#fff;font-size:16px;text-decoration:none;cursor:pointer;box-shadow:0 4px 18px rgba(0,0,0,.5)}
.fab-list i{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:11px;color:#fff}
.fab-list .max i{background:linear-gradient(135deg,#3fb7ff,#7a4dff)}
.fab-list .vk i{background:#2787f5}
.fab-list .tg i{background:#27a7e7}

/* ===== v6: расписание ===== */
.schbox{display:flex;align-items:center;gap:18px;margin-top:20px;padding:22px 22px;border-radius:24px;background:linear-gradient(135deg,#ffd24a,#ffb300);color:#1a1200;text-decoration:none;box-shadow:0 0 40px rgba(255,198,41,.35);transition:transform .25s,box-shadow .25s}
.schbox:hover{transform:translateY(-3px);box-shadow:0 0 56px rgba(255,198,41,.6)}
.schico{flex:none;width:60px;height:60px;border-radius:50%;background:rgba(26,18,0,.12);display:grid;place-items:center}
.schico svg{width:32px;height:32px}
.schtx{flex:1;text-align:left}
.schtx b{display:block;font-size:clamp(20px,5.4vw,26px);line-height:1.2;font-weight:400}
.schtx small{display:block;font-size:14px;margin-top:4px;opacity:.75}
.schgo{flex:none;font-size:30px}

/* ===== v7: вертикальный формат на любом экране ===== */
.hall{display:flex;justify-content:center;align-items:center;padding:56px 16px}
.hall-in{display:flex;flex-direction:column;align-items:stretch;width:100%;max-width:460px;min-height:0}
.hall .ph{height:auto;min-height:0;aspect-ratio:4/5;border-radius:28px;margin-bottom:22px;box-shadow:0 20px 60px rgba(0,0,0,.55)}
.hall .ph:after{display:none}
.hall .tile{display:block;flex:none;width:100%}
.hall .tx{max-width:none;margin:0;padding:0}

/* ===== v8: карточка-страница в рамке, на фоне космоса ===== */
.hall,.hall-even{width:auto;margin-left:0;background:none;padding:44px 16px 56px;min-height:100vh;min-height:100svh}
.hall:before{display:block;opacity:.3}
.hall-in{position:relative;isolation:isolate;max-width:460px}
.hall-in:before{content:"";position:absolute;inset:12px -10px -12px 10px;border-radius:38px;border:1px solid var(--edge);background:rgba(138,77,255,.1);z-index:-1;rotate:2.5deg}
.hall .tile{border:1.5px solid #cfc2ff;border:1.5px solid color-mix(in srgb,var(--gl) 55%,white);border-radius:34px;background:#0b0816;overflow:hidden;box-shadow:0 0 46px rgba(138,77,255,.4);box-shadow:0 0 46px color-mix(in srgb,var(--gl) 40%,transparent)}
.hall .ph{height:270px;aspect-ratio:auto;border-radius:0;margin:0;box-shadow:none}
.hall .ph:after{display:block;height:90px;background:linear-gradient(to top,#0b0816,rgba(11,8,22,0))}
.hall .tx{padding:6px 24px 26px}

/* ===== v9: карусель залов ===== */
.hcar{margin:18px -10px 0}
.htabs{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.htabs button{min-height:44px;padding:0 22px;border-radius:999px;border:1px solid var(--edge);background:rgba(255,255,255,.07);color:var(--txt);font-size:16px;cursor:pointer;transition:background .25s,color .25s}
.htabs button.on{background:var(--sun);color:#1a1200;border-color:var(--sun)}
.hview{position:relative}
.htrk{display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scroll-behavior:smooth;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;transition:height .4s ease;outline:none}
.htrk::-webkit-scrollbar{display:none}
.hslide{flex:0 0 100%;min-width:0;scroll-snap-align:center;scroll-snap-stop:always;padding:24px 10px 32px;align-self:flex-start}
.hslide.sun{--gl:#ffb300}.hslide.moon{--gl:#9d8cff}.hslide.earth{--gl:#2f9bff}
.hslide .tile{max-width:1000px;margin:0 auto;border:1.5px solid #cfc2ff;border:1.5px solid color-mix(in srgb,var(--gl) 55%,white);border-radius:30px;background:#0b0816;overflow:hidden;box-shadow:0 0 40px rgba(138,77,255,.4);box-shadow:0 0 40px color-mix(in srgb,var(--gl) 40%,transparent)}
.hslide .ph{height:150px;border-radius:0}
.hslide .ph:after{height:70px;background:linear-gradient(to top,#0b0816,rgba(11,8,22,0))}
.hslide .tx{display:flex;flex-direction:column;padding:4px 18px 20px}
.hcl,.hcr{display:contents}
.hslide h3{order:1;font-size:21px;line-height:1.2;margin-bottom:10px}
.hslide h3 small{font-size:.6em}
.hprice{order:2}
.hslide .acts{order:3;margin-top:10px}
.hmore{order:4;display:flex;align-items:center;justify-content:space-between;width:100%;min-height:48px;margin-top:12px;padding:0 16px;border-radius:14px;border:1px solid var(--edge);background:rgba(255,255,255,.06);color:#fff;font-size:15.5px;cursor:pointer}
.hmore i{width:10px;height:10px;border-right:2px solid var(--sun);border-bottom:2px solid var(--sun);transform:rotate(45deg) translateY(-3px);transition:transform .25s}
.tile.open .hmore i{transform:rotate(-135deg) translateY(-3px)}
.hdet{order:5;display:none;margin-top:14px}
.tile.open .hdet{display:block}
.hslide .tile ul{font-size:15px;margin-bottom:14px}
.hslide .pr{margin-top:6px;padding-top:10px}
.hslide .pr strong{font-size:26px}
.hslide .pgrid{grid-template-columns:1fr 1fr;gap:6px;margin:0}
.hslide .pgrid div{flex-direction:column;align-items:flex-start;padding:9px 11px;font-size:13.5px}
.hslide .pgrid small{font-size:11.5px}
.hslide .pgrid strong{font-size:17px}
.hb{display:none}
@media(min-width:880px){
  .hcar{margin:22px auto 0;max-width:1120px}
  .hslide{padding:26px 24px 36px}
  .hslide .tile{display:grid;grid-template-columns:300px 1fr;min-height:430px}
  .hslide .ph{height:auto;min-height:100%}
  .hslide .ph:after{left:auto;top:0;bottom:0;right:-1px;width:110px;height:auto;background:linear-gradient(to left,#0b0816,rgba(11,8,22,0))}
  .hslide .tx{display:grid;grid-template-columns:1.1fr 1fr;gap:30px;padding:30px 34px}
  .hcl,.hcr{display:flex;flex-direction:column;min-width:0}
  .hcr{justify-content:center}
  .hslide h3{font-size:25px;margin-bottom:14px}
  .hmore{display:none}
  .hdet{display:block;margin-top:0}
  .hslide .tile ul{font-size:15.5px}
  .hslide .pr{margin-top:0}
  .hslide .pr strong{font-size:34px}
  .hslide .pgrid{grid-template-columns:1fr;gap:8px}
  .hslide .pgrid div{flex-direction:row;align-items:center;padding:10px 14px;font-size:15px}
  .hslide .pgrid small{font-size:13px}
  .hslide .pgrid strong{font-size:20px}
  .hb{display:grid;place-items:center;position:absolute;top:50%;z-index:4;width:48px;height:48px;margin-top:-24px;border-radius:50%;border:1px solid var(--edge);background:rgba(4,3,10,.8);color:#fff;font-size:28px;line-height:1;cursor:pointer;box-shadow:0 0 18px rgba(138,77,255,.6)}
  .hb.p{left:-4px}.hb.n{right:-4px}.hb:disabled{opacity:.25;cursor:default}
  .hslide .acts{margin-top:16px}
}

.hage{order:6;display:none;margin:12px 0 0}
.tile.open .hage{display:block}
.hslide .feat{gap:6px;margin-bottom:12px}.hslide .feat span{font-size:13.5px;padding:6px 12px}
@media(min-width:880px){.hage{display:block;margin:16px 0 0}.hslide .tile{min-height:0}}

/* ===== v10: навигация карусели на телефоне, одинаковый размер ===== */
.hb{display:grid;place-items:center;position:absolute;top:96px;z-index:4;width:42px;height:42px;margin-top:0;border-radius:50%;border:1px solid var(--edge);background:rgba(4,3,10,.78);color:#fff;font-size:26px;line-height:1;padding-bottom:3px;cursor:pointer;box-shadow:0 0 16px rgba(138,77,255,.6)}
.hb.p{left:4px}.hb.n{right:4px}.hb:disabled{opacity:.25;cursor:default}
.hdots{display:flex;justify-content:center;gap:12px;margin-top:2px}
.hdots button{width:12px;height:12px;padding:0;border-radius:50%;border:0;background:rgba(255,255,255,.35);cursor:pointer;transition:all .3s}
.hdots button.on{background:var(--sun);width:30px;border-radius:7px}
.hhint{margin-top:12px;font-size:14px;color:var(--mut)}
@media(min-width:880px){.hb{top:50%;margin-top:-24px;width:48px;height:48px;font-size:28px}.hb.p{left:-4px}.hb.n{right:-4px}.hhint{display:none}}
@media(max-width:879px){.hslide .pgrid small{display:none}.hslide .pgrid div{padding:8px 11px}.hslide .pgrid div span{font-size:13px}}

/* ===== совместимость со старыми браузерами ===== */
.bg,.stars,.ov{top:0;left:0;right:0;bottom:0}
#bk,#md{top:0;left:0;right:0;bottom:0}
dialog:not([open]){display:none}
.no-dialog dialog[open]{display:block;position:fixed;top:0;left:0;right:0;bottom:0;z-index:100;overflow:auto;background:rgba(0,0,0,.94)}
.no-dialog #bk[open] .glass,.no-dialog #md[open] .glass{box-shadow:0 0 0 100vmax rgba(0,0,0,.9)}
.no-dialog #bk[open],.no-dialog #md[open]{background:none}

/* ===== v11: правки по итогам встречи с руководителем ===== */
.meta{justify-content:center;text-align:center}
.burger{width:44px;height:44px;gap:5px;top:calc(env(safe-area-inset-top,0px) + 12px);left:12px;background:rgba(4,3,10,.6);box-shadow:0 0 14px rgba(138,77,255,.35)}
.burger i{width:18px;height:2px}
a.sl{text-decoration:none}
.cta2{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.cta2 .btn{min-width:160px}
.acts .btn-sun{grid-column:auto}
.acts .btn-sun,.acts [data-write]{min-height:52px;font-size:17px}
.hslide .pgrid div{padding:11px 13px;font-size:14.5px}
.hslide .pgrid strong{font-size:19px}
.pgrid strong.ask{font-size:15px}
@media(min-width:880px){.hslide .pgrid div{padding:12px 16px;font-size:16px}.hslide .pgrid strong{font-size:22px}}
.fin h2 small.big2{font-size:1em;font-weight:inherit;color:inherit;text-transform:uppercase}
.ph-col{display:flex;flex-direction:column;align-items:center;gap:4px}
.ph-row{display:inline-flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center}
.msg{flex:none;width:42px;height:42px;border-radius:50%;border:1.5px solid var(--edge);background:var(--glass);color:#fff;display:inline-grid;place-items:center;cursor:pointer;transition:box-shadow .3s,border-color .3s}
.msg:hover{border-color:var(--sun);box-shadow:0 0 18px rgba(138,77,255,.8)}
.msg svg{width:20px;height:20px}
.fin .fio{display:block;font-size:17px;margin:2px 0 4px}
.soc-t{margin-top:10px;font-size:14px;color:var(--mut)}
.wl{display:grid;gap:10px;margin-top:18px}
.wl .mbtn{width:100%}
.wl .mbtn.off{opacity:.55}
.folds{display:grid;grid-template-columns:1fr 1fr;gap:26px 12px;margin-top:40px}
@media(min-width:800px){.folds{grid-template-columns:repeat(4,1fr);gap:30px 16px}}
.fold{position:relative;display:flex;flex-direction:column;border:1.5px solid var(--edge);border-radius:0 22px 22px 22px;background:#0b0816;color:var(--txt);cursor:pointer;padding:0;text-align:left;box-shadow:0 0 24px rgba(138,77,255,.3);transition:transform .45s cubic-bezier(.2,.8,.3,1),box-shadow .45s}
.fold:before{content:"";position:absolute;top:-13px;left:-1.5px;width:84px;height:14px;border:1.5px solid var(--edge);border-bottom:0;border-radius:12px 12px 0 0;background:#0b0816}
.fold:hover{transform:translateY(-6px);box-shadow:0 0 30px rgba(138,77,255,.65)}
.fold .fph{display:block;width:100%;height:auto;aspect-ratio:16/9;object-fit:cover;object-position:center;background:#000;border-radius:0 20px 0 0}
.fold b{padding:12px 14px 2px;font-size:17px;line-height:1.25;font-weight:400}
.fold small{padding:0 14px 14px;color:var(--mut);font-size:13.5px;line-height:1.35}

#bk{display:none;position:fixed!important;top:0!important;left:0!important;right:0!important;bottom:0!important;width:auto!important;height:auto!important;max-height:none!important;margin:0!important;padding:12px;z-index:1000;background:rgba(0,0,0,.92);overflow:auto;align-items:center;justify-content:center}
#bk.open{display:flex}
#bk .glass{position:relative;width:min(480px,100%);margin:auto}
.fl{margin-top:16px;font-size:14px;color:var(--vio2);text-align:left}
.cfl{max-width:640px;margin:18px auto 0}
.cfl .tabs{justify-content:flex-start;margin:6px 0 0}
.cfl .empty2{margin-top:18px;color:var(--mut)}
.pd{max-width:640px;margin:22px auto 0;font-size:13px;line-height:1.5;color:var(--mut)}

#services .wrap{max-width:560px}
#services h2{color:var(--sun)}
.pz-lead{margin:10px 0 0;font-size:12.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--mut)}
.pz-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:22px 0 12px}
.pz-tabs button{min-width:0;min-height:58px;padding:6px 4px;border-radius:8px;border:1px solid var(--edge);background:rgba(255,255,255,.06);color:var(--txt);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.pz-tabs b{font:700 15px/1.1 system-ui,sans-serif}
.pz-tabs span{font:500 11.5px/1.2 system-ui,sans-serif;color:var(--mut)}
.pz-tabs button.on{background:var(--sun);border-color:var(--sun);color:#1a1200}
